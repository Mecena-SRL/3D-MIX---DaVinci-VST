[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mix3d"
version = "0.0.8"
description = "Fusione multi-sorgente e mix per concerti, integrato con DaVinci Resolve"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mix3d = "mix3d.cli:main"

[tool.setuptools.package-data]
mix3d = ["data/*.json", "web/*", "web/vendor/*", "resolve_plugin/*", "resolve_plugin/workflow/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
